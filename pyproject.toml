[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-docs-rag"
version = "0.1.0"
description = "RAG system that answers Kubernetes questions from a bounded local docs corpus, with grounded citations and abstention."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ollama>=0.6.2,<0.7",
    "httpx>=0.27",
    "chromadb>=1.5,<2",
    "rank-bm25>=0.2.2,<0.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
k8s-rag = "k8s_docs_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k8s_docs_rag"]
